<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Star Wars: Resurgence</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:'Oswald',sans-serif;
    background:#000;
    color:#fff;
}

.background{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
}

.overlay{
    position:fixed;
    inset:0;
    background:
        linear-gradient(to top, rgba(0,0,0,.85) 0%, rgba(0,0,0,.35) 40%, rgba(0,0,0,.15) 100%);
}

.topbar{
    position:absolute;
    top:40px;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
}

.topbar h1{
    font-size:90px;
    letter-spacing:10px;
    text-transform:uppercase;
    text-shadow:0 0 30px rgba(255,255,255,.2);
}

.topbar p{
    font-size:20px;
    letter-spacing:8px;
    text-transform:uppercase;
    color:#cfe7ff;
}

.logo{
    width:120px;
    margin-bottom:20px;
    filter:drop-shadow(0 0 20px rgba(120,180,255,.6));
}

.loading-panel{
    position:absolute;
    left:60px;
    bottom:60px;
    width:600px;
}

.loading-title{
    font-size:28px;
    letter-spacing:4px;
    text-transform:uppercase;
    margin-bottom:20px;
}

.status{
    display:flex;
    justify-content:space-between;
    margin-bottom:12px;
    font-size:18px;
    letter-spacing:2px;
}

.bar{
    width:100%;
    height:16px;
    border:1px solid rgba(130,190,255,.5);
    background:rgba(0,0,0,.5);
    padding:3px;
}

.fill{
    height:100%;
    width:15%;
    background:linear-gradient(90deg,#1f5cb5,#58a9ff,#d8efff);
    box-shadow:0 0 18px rgba(88,169,255,.9);
}

.tip{
    margin-top:18px;
    color:rgba(255,255,255,.75);
    font-size:18px;
}

.server-info{
    position:absolute;
    right:60px;
    bottom:60px;
    text-align:right;
}

.server-info .big{
    font-size:38px;
    letter-spacing:4px;
    text-transform:uppercase;
}

.server-info .small{
    font-size:18px;
    color:#b8d9ff;
    letter-spacing:3px;
    text-transform:uppercase;
}

.scanline{
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
    repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,.02) 0px,
        rgba(255,255,255,.02) 1px,
        transparent 2px,
        transparent 4px
    );
}
</style>
</head>

<body>

<img src="background.png" class="background">
<div class="overlay"></div>

<div class="topbar">
    <img src="resurgence.png" class="logo">
    <p>Star Wars</p>
    <h1>Resurgence</h1>
</div>

<div class="loading-panel">

    <div class="loading-title">
        Establishing HoloNet Connection
    </div>

    <div class="status">
        <span id="statusText">Loading server assets...</span>
        <span id="percent">15%</span>
    </div>

    <div class="bar">
        <div class="fill" id="fill"></div>
    </div>

    <div class="tip" id="tip">
        Welcome to Daiyu. Identification must remain visible.
    </div>

</div>

<div class="server-info">
    <div class="big">Imperial Occupation</div>
    <div class="small">Roleplay Server</div>
</div>

<div class="scanline"></div>

<script>
const tips = [
"Welcome to Daiyu. Identification must remain visible.",
"Imperial authority is absolute.",
"Remain in character at all times.",
"Respect checkpoints and security personnel.",
"Loading models, materials and server content."
];

let tip = 0;

setInterval(()=>{
    tip=(tip+1)%tips.length;
    document.getElementById("tip").textContent=tips[tip];
},5000);

function GameDetails(servername,serverurl,mapname,maxplayers,steamid,gamemode){
    document.getElementById("statusText").textContent="Loading "+mapname;
}

function SetStatusChanged(status){
    if(status){
        document.getElementById("statusText").textContent=status;
    }
}

function SetFilesTotal(total){}

function SetFilesNeeded(needed){
    let done=Math.max(0,100-Math.min(100,needed));
    document.getElementById("percent").textContent=done+"%";
    document.getElementById("fill").style.width=done+"%";
}
</script>

</body>
</html>
