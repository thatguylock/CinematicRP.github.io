<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Star Wars: Resurgence</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:'Oswald',sans-serif;
    color:white;
    background:#000;
}

.background{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-3;
}

.overlay{
    position:fixed;
    inset:0;
    background:
        linear-gradient(rgba(0,0,0,.15),rgba(0,0,0,.65)),
        linear-gradient(90deg,rgba(0,0,0,.55),transparent,rgba(0,0,0,.55));
    z-index:-2;
}

.center{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px;
}

.panel{
    width:min(700px,90vw);
    background:rgba(3,8,15,.72);
    border:1px solid rgba(120,180,255,.25);
    padding:50px;
    text-align:center;
    box-shadow:0 0 60px rgba(88,169,255,.20);
}

.logo{
    width:180px;
    margin-bottom:20px;
    filter:drop-shadow(0 0 20px rgba(88,169,255,.5));
}

.top{
    color:#9fd0ff;
    letter-spacing:.5em;
    text-transform:uppercase;
    font-size:15px;
}

h1{
    font-size:84px;
    line-height:1;
    letter-spacing:.08em;
    text-transform:uppercase;
    text-shadow:0 0 25px rgba(88,169,255,.35);
}

.sub{
    margin-top:10px;
    font-size:20px;
    letter-spacing:.15em;
    text-transform:uppercase;
    color:rgba(255,255,255,.8);
}

.line{
    height:1px;
    margin:30px 0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
}

.status{
    display:flex;
    justify-content:space-between;
    text-transform:uppercase;
    margin-bottom:10px;
}

.bar{
    width:100%;
    height:14px;
    border:1px solid rgba(120,180,255,.45);
    padding:2px;
}

.fill{
    height:100%;
    width:35%;
    background:linear-gradient(90deg,#2a6ec4,#58a9ff,#c5e6ff);
    box-shadow:0 0 18px rgba(88,169,255,.8);
}

.tip{
    margin-top:20px;
    color:rgba(255,255,255,.7);
}

.footer{
    position:fixed;
    bottom:25px;
    left:25px;
    color:rgba(255,255,255,.5);
    letter-spacing:.15em;
    text-transform:uppercase;
}
</style>

</head>

<body>

<img class="background" src="background.png" alt="Background">

<div class="overlay"></div>

<div class="center">
    <div class="panel">

```
    <img class="logo" src="resurgence.png" alt="Resurgence">

    <div class="top">Star Wars</div>
    <h1>Resurgence</h1>
    <div class="sub">Imperial Occupation Roleplay</div>

    <div class="line"></div>

    <div class="status">
        <span id="statusText">Loading server assets</span>
        <span id="percent">35%</span>
    </div>

    <div class="bar">
        <div class="fill" id="fill"></div>
    </div>

    <div class="tip" id="tip">
        Welcome to the capital. Identification must remain visible.
    </div>

</div>
```

</div>

<div class="footer">
    Imperial Network // Secure Asset Load
</div>

<script>
const tips = [
"Welcome to the capital. Identification must remain visible.",
"Remain in character. Keep comms clean. Follow staff instructions.",
"Respect checkpoints, chain of command, and sector law.",
"Loading assets, models, materials, and server content.",
"Imperial authority is absolute. Civil order is mandatory."
];

let tip = 0;

setInterval(()=>{
    tip=(tip+1)%tips.length;
    document.getElementById("tip").textContent=tips[tip];
},5000);

function GameDetails(servername,serverurl,mapname){
    document.getElementById("statusText").textContent="Loading "+mapname;
}

function SetStatusChanged(status){
    if(status){
        document.getElementById("statusText").textContent=status;
    }
}

function SetFilesTotal(total){}

function SetFilesNeeded(needed){
    const done=Math.max(0,100-Math.min(100,needed));
    document.getElementById("percent").textContent=done+"%";
    document.getElementById("fill").style.width=done+"%";
}
</script>

</body>
</html>
