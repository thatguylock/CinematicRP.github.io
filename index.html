<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Star Wars: Resurgence</title>

<style>
@import url("https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&display=swap");

*{margin:0;padding:0;box-sizing:border-box}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:"Oswald",Arial,sans-serif;
  color:#fff;
}

.bg{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:0;
}

.shade{
  position:fixed;
  inset:0;
  background:
    linear-gradient(90deg,rgba(0,0,0,.72),rgba(0,0,0,.18),rgba(0,0,0,.45)),
    linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.48));
  z-index:1;
}

.content{
  position:relative;
  z-index:2;
  height:100%;
  padding:70px;
}

.header{
  display:flex;
  align-items:center;
  gap:24px;
}

.logo{
  width:95px;
  height:95px;
  object-fit:contain;
  opacity:.9;
}

.title small{
  display:block;
  color:#b9d9ff;
  letter-spacing:8px;
  font-size:18px;
  text-transform:uppercase;
  margin-bottom:8px;
}

.title h1{
  font-size:72px;
  line-height:.9;
  letter-spacing:8px;
  text-transform:uppercase;
  font-weight:700;
}

.title p{
  margin-top:10px;
  font-size:18px;
  letter-spacing:5px;
  color:rgba(255,255,255,.75);
  text-transform:uppercase;
}

.loading{
  position:absolute;
  left:70px;
  bottom:80px;
  width:560px;
}

.loading h2{
  font-size:28px;
  letter-spacing:5px;
  text-transform:uppercase;
  margin-bottom:22px;
  font-weight:500;
}

.row{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
  font-size:18px;
  letter-spacing:1px;
}

.bar{
  width:100%;
  height:10px;
  background:rgba(255,255,255,.18);
}

.fill{
  height:100%;
  width:16%;
  background:#74b7ff;
  box-shadow:0 0 12px rgba(116,183,255,.75);
}

.tip{
  margin-top:18px;
  font-size:17px;
  color:rgba(255,255,255,.68);
  letter-spacing:1px;
}

.right{
  position:absolute;
  right:70px;
  bottom:80px;
  text-align:right;
}

.right h3{
  font-size:34px;
  letter-spacing:6px;
  text-transform:uppercase;
}

.right p{
  margin-top:8px;
  font-size:18px;
  letter-spacing:5px;
  color:#b9d9ff;
  text-transform:uppercase;
}
</style>
</head>

<body>

<img class="bg" src="background.png" alt="">
<div class="shade"></div>

<div class="content">

  <div class="header">
    <img class="logo" src="resurgence.png" alt="">
    <div class="title">
      <small>Star Wars</small>
      <h1>Resurgence</h1>
      <p>Imperial Occupation Roleplay</p>
    </div>
  </div>

  <div class="loading">
    <h2>Joining Server</h2>

    <div class="row">
      <span id="statusText">Loading server assets...</span>
      <span id="percent">16%</span>
    </div>

    <div class="bar">
      <div class="fill" id="fill"></div>
    </div>

    <div class="tip" id="tip">Remain in character at all times.</div>
  </div>

  <div class="right">
    <h3>Imperial Occupation</h3>
    <p>Roleplay Server</p>
  </div>

</div>

<script>
const tips=[
  "Remain in character at all times.",
  "Respect checkpoints and sector law.",
  "Follow staff instructions.",
  "Loading server content.",
  "Welcome to Daiyu."
];

let tipIndex=0;
let fakePercent=16;

setInterval(function(){
  tipIndex=(tipIndex+1)%tips.length;
  document.getElementById("tip").textContent=tips[tipIndex];
},5000);

setInterval(function(){
  fakePercent+=Math.floor(Math.random()*5)+1;
  if(fakePercent>96){fakePercent=18;}
  document.getElementById("percent").textContent=fakePercent+"%";
  document.getElementById("fill").style.width=fakePercent+"%";
},900);

function GameDetails(servername,serverurl,mapname,maxplayers,steamid,gamemode){
  document.getElementById("statusText").textContent="Loading "+mapname;
}

function SetStatusChanged(status){
  if(status){document.getElementById("statusText").textContent=status;}
}

function SetFilesTotal(total){}

function SetFilesNeeded(needed){
  const done=Math.max(0,100-Math.min(100,needed));
  document.getElementById("percent").textContent=done+"%";
  document.getElementById("fill").style.width=done+"%";
}
</script>

</body>
</html>
