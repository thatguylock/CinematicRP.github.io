<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cinematic Loading Screen</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#020202;color:#fff;font-family:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif}
body{background-image:linear-gradient(rgba(0,0,0,.06),rgba(0,0,0,.25)),url("background.png");background-size:cover;background-position:center;background-repeat:no-repeat}
.screen-vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at center,transparent 42%,rgba(0,0,0,.32) 100%),linear-gradient(to bottom,rgba(0,0,0,.05),rgba(0,0,0,.35))}
.loader-wrap{position:fixed;left:50%;bottom:8.5%;transform:translateX(-50%);width:min(47vw,770px);text-align:center}
.loading-text{font-family:"Arial Narrow",Arial,sans-serif;font-size:clamp(15px,1.05vw,23px);letter-spacing:10px;font-weight:800;color:#f4f4f4;text-shadow:0 1px 8px rgba(0,0,0,.85);margin-bottom:16px}
.segments{display:grid;grid-template-columns:repeat(16,1fr);gap:6px;width:100%;height:20px}
.segment{background:rgba(18,18,18,.92);border:1px solid rgba(255,255,255,.16);transform:skewX(-7deg);box-shadow:inset 0 0 0 1px rgba(0,0,0,.35),0 1px 4px rgba(0,0,0,.55)}
.segment.active{background:#a80d15;border-color:rgba(255,255,255,.18);box-shadow:0 0 6px rgba(168,13,21,.34),inset 0 0 0 1px rgba(255,255,255,.08)}
.percent{margin-top:14px;font-family:"Arial Narrow",Arial,sans-serif;letter-spacing:8px;font-size:clamp(14px,1vw,20px);color:#bd1019;text-shadow:0 1px 7px rgba(0,0,0,.8)}
.status{position:fixed;left:28px;bottom:24px;font-family:Arial,sans-serif;font-size:11px;letter-spacing:3px;color:rgba(255,255,255,.56);text-transform:uppercase;text-shadow:0 1px 5px rgba(0,0,0,.85)}
.bottom-rule{position:fixed;left:28px;right:28px;bottom:14px;height:1px;background:linear-gradient(90deg,rgba(180,15,22,.6),rgba(255,255,255,.14),rgba(180,15,22,.6));opacity:.45}
@media(max-width:900px){.loader-wrap{width:72vw;bottom:8%}.segments{gap:4px;height:17px}.status{font-size:9px;letter-spacing:2px}}
</style>
</head>
<body>
<div class="screen-vignette"></div>
<div class="loader-wrap">
  <div class="loading-text">LOADING...</div>
  <div class="segments" id="segments"></div>
  <div class="percent" id="percent">78%</div>
</div>
<div class="status">ESTABLISHING SERVER CONNECTION</div>
<div class="bottom-rule"></div>
<script>
const TOTAL_SEGMENTS=16;
const segmentBox=document.getElementById("segments");
const percentText=document.getElementById("percent");
let percent=78;
for(let i=0;i<TOTAL_SEGMENTS;i++){const div=document.createElement("div");div.className="segment";segmentBox.appendChild(div);}
function renderProgress(value){
  const activeCount=Math.round((value/100)*TOTAL_SEGMENTS);
  document.querySelectorAll(".segment").forEach((segment,index)=>segment.classList.toggle("active",index<activeCount));
  percentText.textContent=Math.round(value)+"%";
}
renderProgress(percent);
setInterval(()=>{percent+=Math.random()*3.5;if(percent>100){percent=4;}renderProgress(percent);},900);
</script>
</body>
</html>
