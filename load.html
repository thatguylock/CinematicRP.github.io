<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background-color: black;
}

/* centered container */
.wrapper {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100%;
    text-align: center;
}

/* your banner */
.banner {
    max-width: 70%;
    height: auto;
}

/* optional bottom text */
.loading {
    margin-top: 20px;
    color: #4da3ff;
    font-size: 14px;
    letter-spacing: 3px;
}
</style>
</head>

<body>

<div class="wrapper">
    <img src="cinematicbanner3.png" class="banner">
    
    <div class="loading">
        LOADING CINEMATIC CLONE WARS
    </div>
</div>

</body>
</html>
